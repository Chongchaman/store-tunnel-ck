<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>รายละเอียด — STORE TUNNEL CK</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#FF6B35',dark:'#E55A2B',light:'#FF8F66','50':'#FFF3ED'},secondary:{DEFAULT:'#1E40AF',light:'#3B82F6'}},fontFamily:{sans:['"IBM Plex Sans Thai"','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/th.js"></script>
  <!-- QR Code generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-gray-50 font-sans pb-20">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3">
    <div class="flex items-center gap-2 max-w-lg mx-auto">
      <button onclick="history.back()" class="btn-icon"><i data-lucide="arrow-left"></i></button>
      <h1 class="text-lg font-bold text-gray-800">รายละเอียด</h1>
    </div>
  </header>

  <main class="px-4 py-4 max-w-lg mx-auto" id="item-detail">
    <div class="skeleton-card"><div class="skeleton-line w-40"></div><div class="skeleton-line w-70"></div><div class="skeleton-line w-55"></div></div>
    <div class="skeleton-card"><div class="skeleton-line w-55"></div><div class="skeleton-line w-40"></div></div>
  </main>

  <div id="bottom-nav"></div>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');

    const itemCode = App.getParam('code');
    if (!itemCode) {
      document.getElementById('item-detail').innerHTML = UI.renderEmptyState('ไม่ระบุรหัสรายการ', 'กลับหน้ารายการ', 'items.html');
      lucide.createIcons();
    } else {
      App.loadItemDetail(itemCode);
    }

    UI.initPage('items');
  </script>
</body>
</html>
