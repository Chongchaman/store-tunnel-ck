<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>การแจ้งเตือน — STORE TUNNEL CK</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#FF6B35',dark:'#E55A2B',light:'#FF8F66','50':'#FFF3ED'},secondary:{DEFAULT:'#1E40AF',light:'#3B82F6'}},fontFamily:{sans:['"IBM Plex Sans Thai"','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .alert-item { transition: all 0.15s ease; }
    .alert-item:active { transform: scale(0.98); }
  </style>
</head>
<body class="bg-gray-50 font-sans pb-24">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3">
    <div class="flex items-center gap-2 max-w-lg mx-auto md:max-w-5xl">
      <button onclick="history.back()" class="btn-icon"><i data-lucide="arrow-left"></i></button>
      <h1 class="text-lg font-bold text-gray-800 flex-1">การแจ้งเตือน</h1>
      <span id="alert-count" class="text-xs bg-red-100 text-red-600 font-bold px-2.5 py-1 rounded-full"></span>
    </div>
  </header>

  <main class="px-4 py-4 max-w-lg mx-auto">

    <!-- Filter tabs -->
    <div class="flex gap-2 mb-4 overflow-x-auto pb-0.5">
      <button onclick="setFilter('all')"     class="filter-tab active" data-f="all">ทั้งหมด</button>
      <button onclick="setFilter('danger')"  class="filter-tab" data-f="danger">🔴 วิกฤต</button>
      <button onclick="setFilter('warning')" class="filter-tab" data-f="warning">🟡 เฝ้าระวัง</button>
    </div>

    <!-- Skeleton -->
    <div id="skeleton" class="space-y-3">
      <div class="bg-white rounded-2xl p-4 animate-pulse flex gap-3">
        <div class="w-10 h-10 rounded-xl bg-gray-200 flex-shrink-0"></div>
        <div class="flex-1"><div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div><div class="h-3 bg-gray-100 rounded w-1/2"></div></div>
      </div>
      <div class="bg-white rounded-2xl p-4 animate-pulse flex gap-3">
        <div class="w-10 h-10 rounded-xl bg-gray-200 flex-shrink-0"></div>
        <div class="flex-1"><div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div><div class="h-3 bg-gray-100 rounded w-1/3"></div></div>
      </div>
    </div>

    <!-- Alert list -->
    <div id="alert-list" class="grid grid-cols-1 md:grid-cols-2 gap-3" style="display:none"></div>

    <!-- Empty -->
    <div id="empty-state" class="text-center py-16" style="display:none">
      <div class="w-20 h-20 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="check-circle-2" class="w-9 h-9 text-green-500"></i>
      </div>
      <p class="text-gray-600 font-bold">ไม่มีการแจ้งเตือน</p>
      <p class="text-gray-400 text-sm mt-1">ทุกอย่างปกติดี 👍</p>
    </div>

  </main>

  <div id="bottom-nav"></div>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/app.js"></script>
  <style>
    .filter-tab {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
      border: 1.5px solid #e5e7eb; background: #f9fafb; color: #6b7280;
      cursor: pointer; transition: all 0.15s;
    }
    .filter-tab.active { background: #EF4444; border-color: #EF4444; color: white; }
  </style>
  <script>
    if (!Auth.requireAuth(['Admin', 'Store'])) throw new Error('Unauthorized');

    let allAlerts = [];
    let currentFilter = 'all';

    (async () => {
      const res = await API.getDashboardSummary();
      document.getElementById('skeleton').style.display = 'none';

      if (!res.ok) { UI.showToast('โหลดข้อมูลไม่สำเร็จ', 'error'); return; }

      allAlerts = res.data?.alerts || [];
      renderAlerts();
    })();

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
      renderAlerts();
    }

    function renderAlerts() {
      const list      = document.getElementById('alert-list');
      const emptyEl   = document.getElementById('empty-state');
      const countEl   = document.getElementById('alert-count');

      let filtered = allAlerts;
      if (currentFilter === 'danger')  filtered = allAlerts.filter(a => a.type === 'danger');
      if (currentFilter === 'warning') filtered = allAlerts.filter(a => a.type !== 'danger');

      countEl.textContent = filtered.length + ' รายการ';

      if (filtered.length === 0) {
        list.style.display  = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';
      list.style.display    = 'block';

      list.innerHTML = filtered.map(item => {
        const isDanger = item.type === 'danger';
        const bg       = isDanger ? 'bg-red-50 border-red-200'  : 'bg-amber-50 border-amber-200';
        const iconBg   = isDanger ? 'bg-red-100'                : 'bg-amber-100';
        const iconCol  = isDanger ? 'text-red-500'              : 'text-amber-500';
        const textCol  = isDanger ? 'text-red-800'              : 'text-amber-800';
        const subCol   = isDanger ? 'text-red-400'              : 'text-amber-400';
        const badge    = isDanger ? '🔴 วิกฤต'                   : '🟡 เฝ้าระวัง';
        const icon     = item.message?.includes('เกินกำหนด') || item.message?.includes('เลยกำหนด') ? 'clock' : 'alert-triangle';

        // ถ้า message มี item_code ให้ทำให้คลิกไปหน้า item ได้
        const itemCode = item.item_code || '';
        const clickable = itemCode
          ? `onclick="location.href='item-detail.html?code=${encodeURIComponent(itemCode)}'"  style="cursor:pointer"`
          : '';

        return `
        <div class="alert-item ${bg} border rounded-2xl p-4 flex items-start gap-3" ${clickable}>
          <div class="w-10 h-10 rounded-xl ${iconBg} flex items-center justify-center flex-shrink-0">
            <i data-lucide="${icon}" class="w-5 h-5 ${iconCol}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded-full ${isDanger ? 'bg-red-200 text-red-700' : 'bg-amber-200 text-amber-700'}">${badge}</span>
              ${itemCode ? `<span class="text-xs text-gray-400">${itemCode}</span>` : ''}
            </div>
            <p class="text-sm font-semibold ${textCol} leading-snug">${item.message}</p>
            ${itemCode ? `<p class="text-xs ${subCol} mt-1">แตะเพื่อดูรายละเอียด →</p>` : ''}
          </div>
        </div>`;
      }).join('');

      lucide.createIcons();
    }

    UI.initPage('home');
  </script>
</body>
</html>
