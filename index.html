<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="STORE TUNNEL CK — ระบบจัดการสโตร์ไซต์งานก่อสร้าง">
  <title>เข้าสู่ระบบ — STORE TUNNEL CK</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT:'#FF6B35', dark:'#E55A2B', light:'#FF8F66', 50:'#FFF3ED' },
            secondary: { DEFAULT:'#1E40AF', light:'#3B82F6' },
          },
          fontFamily: { sans: ['"IBM Plex Sans Thai"', 'sans-serif'] },
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'IBM Plex Sans Thai', sans-serif; background:linear-gradient(135deg, #FF6B35 0%, #E55A2B 50%, #1E40AF 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }

    .login-card { background:#fff; border-radius:24px; padding:40px 28px; width:100%; max-width:400px; box-shadow:0 25px 60px rgba(0,0,0,0.2); animation:slideUp .5s ease; }
    .login-logo { text-align:center; margin-bottom:28px; }
    .login-logo .logo-icon { width:72px; height:72px; background:linear-gradient(135deg,#FF6B35,#E55A2B); border-radius:20px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px; box-shadow:0 8px 24px rgba(255,107,53,0.3); }
    .login-logo .logo-icon svg { color:#fff; width:36px; height:36px; }
    .login-logo h1 { font-size:22px; font-weight:700; color:#1F2937; letter-spacing:1px; }
    .login-logo p { font-size:13px; color:#9CA3AF; margin-top:4px; }

    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:13px; font-weight:600; color:#4B5563; margin-bottom:6px; }
    .form-input { width:100%; padding:14px 16px; border:2px solid #E5E7EB; border-radius:14px; font-size:15px; font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s; background:#F9FAFB; }
    .form-input:focus { border-color:#FF6B35; box-shadow:0 0 0 3px rgba(255,107,53,0.15); background:#fff; }
    .form-input.error { border-color:#EF4444; }

    .input-wrapper { position:relative; }
    .input-wrapper .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#9CA3AF; width:18px; height:18px; pointer-events:none; }
    .input-wrapper .form-input { padding-left:42px; }
    .input-wrapper .toggle-pw { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9CA3AF; cursor:pointer; padding:4px; }

    .btn-login { width:100%; padding:14px; background:linear-gradient(135deg,#FF6B35,#E55A2B); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 4px 16px rgba(255,107,53,0.3); }
    .btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(255,107,53,0.4); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:0.7; cursor:not-allowed; transform:none; }

    .spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px; }

    .error-msg { background:#FEF2F2; color:#EF4444; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; display:none; align-items:center; gap:6px; }

    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i data-lucide="hard-hat"></i></div>
      <h1>STORE TUNNEL CK</h1>
      <p>ระบบจัดการสโตร์ไซต์งานก่อสร้าง</p>
    </div>

    <div class="error-msg" id="error-msg">
      <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0"></i>
      <span id="error-text"></span>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="username" name="username" class="form-input" placeholder="กรอกชื่อผู้ใช้" required autocomplete="username" autofocus>
        </div>
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" name="password" class="form-input" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
          <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">เข้าสู่ระบบ</button>
    </form>
  </div>

  <!-- Scripts -->
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    // Init icons
    lucide.createIcons();

    // ถ้ามี session อยู่แล้ว → ไป dashboard
    Auth.checkExistingSession();

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const isPassword = pw.type === 'password';
      pw.type = isPassword ? 'text' : 'password';
      // เปลี่ยน icon
      const btn = document.getElementById('toggle-pw');
      btn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
      lucide.createIcons();
    });

    // Login form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('error-msg');
      const errText = document.getElementById('error-text');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errText.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
        errBox.style.display = 'flex';
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
      errBox.style.display = 'none';

      const result = await Auth.login(username, password);

      if (result.ok) {
        btn.innerHTML = '✓ สำเร็จ';
        btn.style.background = '#10B981';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      } else {
        btn.disabled = false;
        btn.innerHTML = 'เข้าสู่ระบบ';
        errText.textContent = result.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
        errBox.style.display = 'flex';
        // เขย่า form
        document.querySelector('.login-card').style.animation = 'none';
        setTimeout(() => { document.querySelector('.login-card').style.animation = 'shake .4s ease'; }, 10);
      }
    });
  </script>

  <style>
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  </style>
</body>
</html>
