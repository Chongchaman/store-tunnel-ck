<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกน QR/Barcode — STORE TUNNEL CK</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#FF6B35',dark:'#E55A2B',light:'#FF8F66','50':'#FFF3ED'},secondary:{DEFAULT:'#1E40AF',light:'#3B82F6'}},fontFamily:{sans:['"IBM Plex Sans Thai"','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- html5-qrcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-gray-900 font-sans min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur-md px-4 py-3">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <button onclick="stopAndGoBack()" class="btn-icon text-white"><i data-lucide="arrow-left"></i></button>
        <h1 class="text-lg font-bold text-white">สแกน QR / Barcode</h1>
      </div>
      <div class="flex gap-2">
        <button id="btn-flip" class="btn-icon text-white" title="สลับกล้อง"><i data-lucide="switch-camera"></i></button>
        <button id="btn-flash" class="btn-icon text-white" title="ไฟฉาย"><i data-lucide="flashlight"></i></button>
      </div>
    </div>
  </header>

  <main class="px-4 py-4 max-w-lg mx-auto">
    <!-- Scanner viewport -->
    <div class="relative rounded-2xl overflow-hidden bg-black mb-4" style="min-height:300px">
      <div id="qr-reader" style="width:100%"></div>
      <!-- Scan overlay -->
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center" id="scan-overlay">
        <div style="width:220px;height:220px;border:3px solid rgba(255,107,53,0.7);border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,0.4)"></div>
      </div>
    </div>

    <!-- Status -->
    <div class="text-center mb-4">
      <p class="text-gray-400 text-sm" id="scan-status">กำลังเปิดกล้อง...</p>
    </div>

    <!-- Manual input -->
    <div class="bg-gray-800 rounded-2xl p-4">
      <p class="text-gray-400 text-xs mb-2">หรือพิมพ์รหัสด้วยตัวเอง</p>
      <div class="flex gap-2">
        <input type="text" id="manual-code" class="form-input bg-gray-700 border-gray-600 text-white placeholder-gray-500" placeholder="พิมพ์รหัส...">
        <button class="btn btn-primary" onclick="lookupCode(document.getElementById('manual-code').value)">ค้นหา</button>
      </div>
    </div>

    <!-- Result -->
    <div id="scan-result" class="mt-4" style="display:none">
      <div class="bg-white rounded-2xl p-4">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center">
            <i data-lucide="check-circle" class="w-6 h-6 text-green-500"></i>
          </div>
          <div>
            <p class="font-bold text-gray-800" id="result-name"></p>
            <p class="text-xs text-gray-400" id="result-code"></p>
          </div>
        </div>
        <div class="flex gap-2">
          <a id="result-link" href="#" class="btn btn-primary flex-1 justify-center"><i data-lucide="eye"></i> ดูรายละเอียด</a>
          <button class="btn btn-secondary" onclick="resetScanner()"><i data-lucide="scan-line"></i> สแกนใหม่</button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');
    lucide.createIcons();

    let html5QrCode = null;
    let currentCamera = 'environment'; // 'environment' = หลัง, 'user' = หน้า
    const returnTo = App.getParam('return'); // ถ้ามา จากหน้า withdraw

    // ── เริ่ม Scanner ──
    async function startScanner() {
      document.getElementById('scan-status').textContent = 'กำลังเปิดกล้อง...';

      try {
        html5QrCode = new Html5Qrcode('qr-reader');
        await html5QrCode.start(
          { facingMode: currentCamera },
          { 
            fps: 30, // เพิ่มเฟรมเรตเพื่อให้จับภาพได้ไวขึ้น
            qrbox: { width: 260, height: 260 }, // ขยายกล่องให้เล็งง่ายขึ้น
            aspectRatio: 1.0,
            useBarCodeDetectorIfSupported: true // ใช้ตัวถอดรหัสของ Browser (Hardware Acceleration) ซึ่งจะสแกนได้ไวมากบนมือถือ
          },
          onScanSuccess,
          () => {} // ignore scan failures
        );
        document.getElementById('scan-status').textContent = 'เล็งกล้องไปที่ QR Code หรือ Barcode';
      } catch (err) {
        console.error(err);
        document.getElementById('scan-status').textContent = 'ไม่สามารถเปิดกล้องได้ — ลองใช้ช่องพิมพ์รหัสด้านล่าง';
      }
    }

    // ── สแกนสำเร็จ ──
    async function onScanSuccess(decodedText) {
      // หยุด scanner ชั่วคราว
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.pause();
      }
      document.getElementById('scan-status').textContent = `สแกนได้: ${decodedText}`;
      lookupCode(decodedText);
    }

    // ── ค้นหาจาก barcode value ──
    async function lookupCode(code) {
      code = code.trim();
      if (!code) return;

      document.getElementById('scan-status').textContent = 'กำลังค้นหา...';
      const res = await API.lookupBarcode(code);

      if (res.ok && res.data) {
        // พบของ!
        document.getElementById('result-name').textContent = res.data.name;
        document.getElementById('result-code').textContent = res.data.item_code + ' · ' + (CONFIG.CATEGORY_LABELS[res.data.category] || '');

        // กำหนด link ตาม return context
        if (returnTo === 'withdraw') {
          document.getElementById('result-link').href = `withdraw.html?code=${encodeURIComponent(res.data.item_code)}`;
          document.getElementById('result-link').innerHTML = '<i data-lucide="package-minus"></i> เบิกของนี้';
        } else {
          document.getElementById('result-link').href = `item-detail.html?code=${encodeURIComponent(res.data.item_code)}`;
        }

        document.getElementById('scan-result').style.display = 'block';
        document.getElementById('scan-status').textContent = 'พบรายการ!';
        lucide.createIcons();
      } else {
        UI.showToast('ไม่พบของในระบบ: ' + code, 'warning');
        document.getElementById('scan-status').textContent = 'ไม่พบ — ลองสแกนใหม่';
        // Resume scanner
        if (html5QrCode && html5QrCode.getState() === Html5QrcodeScannerState.PAUSED) {
          html5QrCode.resume();
        }
      }
    }

    // ── Reset scanner ──
    async function resetScanner() {
      document.getElementById('scan-result').style.display = 'none';
      if (html5QrCode) {
        if (html5QrCode.getState() === Html5QrcodeScannerState.PAUSED) {
          html5QrCode.resume();
        }
      }
      document.getElementById('scan-status').textContent = 'เล็งกล้องไปที่ QR Code หรือ Barcode';
    }

    // ── สลับกล้อง ──
    document.getElementById('btn-flip').addEventListener('click', async () => {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
      startScanner();
    });

    // ── ไฟฉาย ──
    document.getElementById('btn-flash').addEventListener('click', async () => {
      try {
        if (html5QrCode) {
          const capabilities = html5QrCode.getRunningTrackCameraCapabilities();
          if (capabilities.torchFeature && capabilities.torchFeature().isSupported()) {
            const torch = capabilities.torchFeature();
            await torch.apply(!torch.value());
          } else {
            UI.showToast('อุปกรณ์นี้ไม่รองรับไฟฉาย', 'info');
          }
        }
      } catch { UI.showToast('ไม่สามารถเปิด/ปิดไฟฉายได้', 'info'); }
    });

    // ── Stop & go back ──
    function stopAndGoBack() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => history.back());
      } else {
        history.back();
      }
    }

    // Start
    startScanner();
  </script>
</body>
</html>
