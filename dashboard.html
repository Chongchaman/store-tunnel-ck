<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>หน้าหลัก — STORE TUNNEL CK</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#FF6B35',dark:'#E55A2B',light:'#FF8F66','50':'#FFF3ED'},secondary:{DEFAULT:'#1E40AF',light:'#3B82F6'}},fontFamily:{sans:['"IBM Plex Sans Thai"','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/th.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-gray-50 font-sans pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center shadow-md">
          <i data-lucide="hard-hat" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-gray-800 leading-tight">STORE TUNNEL CK</h1>
          <p class="text-xs text-gray-400" id="user-greeting">สวัสดี</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs bg-primary-50 text-primary font-semibold px-2.5 py-1 rounded-full" id="role-badge"></span>
        <button onclick="Auth.logout()" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors" title="ออกจากระบบ">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="px-4 py-4 max-w-lg mx-auto">
    <!-- Summary Cards -->
    <section class="mb-5">
      <h2 class="text-sm font-bold text-gray-600 mb-3 flex items-center gap-1.5">
        <i data-lucide="bar-chart-3" class="w-4 h-4 text-primary"></i> สรุปสต็อก
      </h2>
      <div class="grid grid-cols-2 gap-3" id="summary-grid">
        <!-- Skeleton -->
        <div class="bg-white rounded-2xl p-4 animate-pulse"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-7 bg-gray-200 rounded w-1/3"></div></div>
        <div class="bg-white rounded-2xl p-4 animate-pulse"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-7 bg-gray-200 rounded w-1/3"></div></div>
        <div class="bg-white rounded-2xl p-4 animate-pulse"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-7 bg-gray-200 rounded w-1/3"></div></div>
        <div class="bg-white rounded-2xl p-4 animate-pulse"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-7 bg-gray-200 rounded w-1/3"></div></div>
      </div>
    </section>

    <!-- Alert Banner (compact) -->
    <section class="mb-5" id="alert-section"></section>

    <!-- Quick Actions -->
    <section class="mb-5" id="quick-actions">
      <h2 class="text-sm font-bold text-gray-600 mb-3 flex items-center gap-1.5">
        <i data-lucide="zap" class="w-4 h-4 text-primary"></i> เมนูด่วน
      </h2>
      <div class="grid grid-cols-4 gap-3" id="actions-grid"></div>
    </section>

    <!-- Recent Transactions -->
    <section class="mb-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-gray-600 flex items-center gap-1.5">
          <i data-lucide="history" class="w-4 h-4 text-primary"></i> เคลื่อนไหวล่าสุด
        </h2>
        <a href="transactions.html" class="text-xs text-primary font-semibold">ดูทั้งหมด →</a>
      </div>
      <div id="recent-tx" class="space-y-2">
        <div class="bg-white rounded-xl p-3 animate-pulse"><div class="h-4 bg-gray-200 rounded w-3/4"></div></div>
        <div class="bg-white rounded-xl p-3 animate-pulse"><div class="h-4 bg-gray-200 rounded w-2/3"></div></div>
      </div>
    </section>
  </main>

  <!-- Bottom Nav -->
  <div id="bottom-nav"></div>

  <!-- Scripts -->
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // Guard
    if (!Auth.requireAuth()) throw new Error('Unauthorized');

    // Setup
    const user = Auth.getUser();
    document.getElementById('user-greeting').textContent = `สวัสดี, ${user.full_name}`;
    document.getElementById('role-badge').textContent = user.role;

    // Quick Actions — แสดงตาม role
    const actions = [
      { icon:'plus-circle',   label:'เพิ่มของ',    href:'add-item.html',  color:'#FF6B35', roles:['Admin','Store'] },
      { icon:'package-minus', label:'เบิกของ',    href:'withdraw.html',  color:'#3B82F6', roles:['Admin','Store'] },
      { icon:'scan-line',     label:'สแกน',       href:'scan.html',      color:'#8B5CF6', roles:['Admin','Store','Worker'] },
      { icon:'file-bar-chart',label:'รายงาน',     href:'reports.html',   color:'#10B981', roles:['Admin','Store'] },
      { icon:'package-plus',  label:'คืนของ',    href:'return.html',    color:'#F59E0B', roles:['Admin','Store'] },
      { icon:'bell',          label:'แจ้งเตือน',   href:'alerts.html',    color:'#EF4444', roles:['Admin','Store'] },
      { icon:'users',         label:'จัดการผู้ใช้', href:'users.html',     color:'#EC4899', roles:['Admin'] },
      { icon:'package',       label:'รายการ',     href:'items.html',     color:'#6366F1', roles:['Admin','Store','Worker'] },
      { icon:'settings',      label:'ตั้งค่า',     href:'settings.html',  color:'#6B7280', roles:['Admin'] },
    ];

    const actionsGrid = document.getElementById('actions-grid');
    const filteredActions = actions.filter(a => a.roles.includes(user.role));
    actionsGrid.innerHTML = filteredActions.map(a => `
      <a href="${a.href}" class="flex flex-col items-center gap-1.5 p-3 bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow active:scale-95 transform duration-150">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${a.color}12;color:${a.color}">
          <i data-lucide="${a.icon}" class="w-5 h-5"></i>
        </div>
        <span class="text-xs font-medium text-gray-600 text-center leading-tight">${a.label}</span>
      </a>
    `).join('');

    // Init page
    UI.initPage('home');

    // Load data
    App.loadDashboard();

    // Load recent transactions
    (async () => {
      const txRes = await API.listTransactions({ limit: 5 });
      const container = document.getElementById('recent-tx');
      if (txRes.ok && txRes.data && txRes.data.length > 0) {
        container.innerHTML = txRes.data.map(tx => `
          <div class="bg-white rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              ${UI.renderActionBadge(tx.action)}
              <div>
                <p class="text-sm font-medium text-gray-700">${tx.item_code}</p>
                <p class="text-xs text-gray-400">${tx.by_user}${tx.for_whom ? ' → '+tx.for_whom : ''}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-semibold ${tx.qty_change < 0 ? 'text-red-500' : 'text-green-600'}">${tx.qty_change > 0 ? '+':''}${tx.qty_change || ''}</p>
              <p class="text-xs text-gray-400">${UI.formatDateTime(tx.datetime)}</p>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">ยังไม่มีรายการ</p>';
      }
    })();
  </script>
</body>
</html>
